<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e64"><title>Mi Organizador</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172b3b;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;padding:22px 16px 50px}h1{font-size:1.75rem;margin:0}p{color:#526777}.panel{background:white;border:1px solid #dce5eb;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 2px 10px #123e6410}label{display:block;font-weight:650;margin-bottom:8px}input,select,button{font:inherit;min-height:48px;border-radius:12px}input,select{border:1px solid #aabdc9;padding:10px;width:100%;background:white}button{cursor:pointer;border:0;padding:10px 15px;font-weight:650}.primary{background:#123e64;color:white;width:100%;margin-top:12px}.tabs{display:flex;gap:8px}.tabs button{flex:1;background:#e8eef3;color:#24445a}.tabs button[aria-selected=true]{background:#123e64;color:white}.task{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #e5edf1}.task:last-child{border-bottom:0}.task .content{flex:1;min-width:0;overflow-wrap:anywhere}.task strong{display:block}.meta{font-size:.83rem;color:#53697a}.high{color:#9e3d27}.actions{display:flex;gap:5px;flex-wrap:wrap}.small{background:#e8eef3;color:#23465d;min-height:44px;font-size:.86rem}.danger{color:#922e2e}.empty{padding:20px 4px;color:#526777;text-align:center}.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}.note{font-size:.82rem}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #008d9b;outline-offset:2px}</style></head><body><main class="app"><h1>Mi Organizador</h1><p>Tus tareas, a tu ritmo.</p><section class="panel"><form id="form"><label for="name">Nueva tarea</label><input id="name" maxlength="180" required placeholder="Ej.: Comprar leche" autocomplete="off"><div class="row"><div><label for="priority">Prioridad</label><select id="priority"><option value="Normal">Normal</option><option value="Alta">Alta</option></select></div></div><button class="primary" type="submit">Agregar tarea</button></form></section><section class="panel"><div class="tabs" role="tablist" aria-label="Estado de tareas"><button id="pendingTab" type="button" role="tab" aria-selected="true">Pendientes (0)</button><button id="doneTab" type="button" role="tab" aria-selected="false">Completadas (0)</button></div><div id="tasks" aria-live="polite"></div></section><p class="note">Las tareas se guardan en este navegador. No se sincronizan con otros dispositivos y pueden perderse si borrás sus datos.</p></main><script>(()=>{'use strict';const KEY='mi-organizador-v1';let tasks=[];let view='pending';const $=id=>document.getElementById(id);try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))tasks=raw.filter(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&typeof t.done==='boolean'&&['Normal','Alta'].includes(t.priority));}catch(e){alert('No se pudieron leer las tareas guardadas. No se sobrescribirán hasta realizar un cambio.');}function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch(e){alert('No se pudo guardar. Revisá el almacenamiento del navegador.');return false}}function update(mutator){const old=tasks.map(t=>({...t}));mutator();if(!save())tasks=old;render()}function render(){const pending=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);$('pendingTab').textContent=`Pendientes (${pending.length})`;$('doneTab').textContent=`Completadas (${done.length})`;for(const [id,active] of [['pendingTab',view==='pending'],['doneTab',view==='done']])$(''+id).setAttribute('aria-selected',String(active));const root=$('tasks');root.replaceChildren();const visible=view==='pending'?pending:done;if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent=view==='pending'?'No hay tareas pendientes.':'Todavía no hay tareas completadas.';root.append(p);return}for(const t of visible){const item=document.createElement('div');item.className='task';const content=document.createElement('div');content.className='content';const name=document.createElement('strong');name.textContent=t.name;const meta=document.createElement('span');meta.className='meta'+(t.priority==='Alta'?' high':'');meta.textContent=`Prioridad ${t.priority.toLowerCase()}`;content.append(name,meta);const actions=document.createElement('div');actions.className='actions';const toggle=document.createElement('button');toggle.type='button';toggle.className='small';toggle.textContent=t.done?'Restaurar':'Completar';toggle.setAttribute('aria-label',(t.done?'Restaurar ':'Completar ')+t.name);toggle.onclick=()=>update(()=>{const found=tasks.find(x=>x.id===t.id);if(found)found.done=!found.done});const del=document.createElement('button');del.type='button';del.className='small danger';del.textContent='Eliminar';del.setAttribute('aria-label','Eliminar '+t.name);del.onclick=()=>{if(confirm(`¿Eliminar definitivamente «${t.name}»?`))update(()=>{tasks=tasks.filter(x=>x.id!==t.id)})};actions.append(toggle,del);item.append(content,actions);root.append(item)}}$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;update(()=>{tasks.unshift({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),name,priority:$('priority').value,done:false})});view='pending';render();$('name').value='';$('name').focus()});$('pendingTab').onclick=()=>{view='pending';render()};$('doneTab').onclick=()=>{view='done';render()};render()})();</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
